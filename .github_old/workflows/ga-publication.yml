name: GA Publication

on:
  release:
    types:
      - created

env:
  JDK_VERSION: '17'
  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

jobs:
  ga-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          cache: maven
          server-id: maven-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Extract version from tag
        run: |
          REF_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$REF_VERSION" >> $GITHUB_ENV
          echo "Publishing version: $REF_VERSION"

      - name: Set version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false

      - name: Publish to Maven Central
        run: |
          mvn -B javadoc:jar source:jar source:test-jar deploy \
            -DskipTests=true \
            -DaltDeploymentRepository="maven-central::${{ vars.MAVEN_REPO_GA }}" \
            -P prepare-for-nexus \
            -DskipPreDeploymentTests=true \
            -DskipPostDeploymentTests=true \
            -Ddependency-check.skip=true